["Maßstab","","Maßstab 1 : 4 500 000. Wie viel in Wirklichkeit entspricht 1 cm auf der Karte?","45 km",["4,5 km","450 km","45 m"],"Fünf Stellen abdecken ergibt Kilometer: 4 500 000 cm sind 45 km."],
["Maßstab","","Welche Karte zeigt mehr Einzelheiten: ein Stadtplan 1 : 12 500 oder eine Österreichkarte 1 : 4 500 000?","der Stadtplan 1 : 12 500",["die Österreichkarte 1 : 4 500 000","beide gleich viele","das hängt nur von den Farben ab"],"Kleine Maßstabszahl bedeutet großer Maßstab, mehr Einzelheiten."],

];
var MODES={all:['Alles gemischt',BASE.concat(KARTE)],base:['Grundlagen',BASE],karte:['Kartenlesen',KARTE]};
var CHECK='<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var CROSS='<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>';
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var main=document.getElementById('main'),foot=document.getElementById('foot'),pg=document.getElementById('pg');
var Q,order,i,score,wrong,mode;
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function render(html){main.innerHTML='<div class="enter">'+html+'</div>';window.scrollTo(0,0)}
function menu(){
 pg.style.width='0%';foot.innerHTML='';
 var h='<h1>GWB Quiz</h1><p>1. Klasse, Test am 17.11.2026. Erde, Kontinente, Karten lesen, Maßstab, Himmelsrichtungen, Höhe, Atlas und Österreich. Die Fragen kommen in zufälliger Reihenfolge.</p>';
 Object.keys(MODES).forEach(function(k){h+='<button class="card" data-m="'+k+'"><span>'+MODES[k][0]+'<small>'+MODES[k][1].length+' Fragen</small></span></button>'});
 render(h);
 main.querySelectorAll('.card').forEach(function(b){b.onclick=function(){start(b.getAttribute('data-m'))}});
}
function start(m){mode=m;Q=MODES[m][1];order=shuf(Q.map(function(_,k){return k}));i=0;score=0;wrong={};show()}
function show(){
 var q=Q[order[i]],opts=shuf([q[3]].concat(q[4])),sel=null,selB=null,done=false;
 pg.style.width=(i/Q.length*100)+'%';
 render('<div class="meta"><span>'+q[0]+'</span><span>Frage '+(i+1)+' von '+Q.length+'</span></div><h1 class="q'+(q[2].length>60?' long':'')+'">'+q[2]+'</h1>'+q[1]+'<div id="o" role="group" aria-label="Antworten"></div><div id="ex" aria-live="polite"></div><button class="link" id="mn">Zurück zum Menü</button>');
 foot.innerHTML='<div class="in"><p id="er" role="alert"></p><button class="main" id="cf">Antwort bestätigen</button></div>';
 var o=document.getElementById('o'),er=document.getElementById('er'),cf=document.getElementById('cf');
 opts.forEach(function(t){
  var b=document.createElement('button');b.className='card';b.setAttribute('aria-pressed','false');
  b.innerHTML='<span>'+t+'</span>';b.setAttribute('data-t',t);
  b.onclick=function(){
   if(done)return;
   if(selB){selB.classList.remove('sel');selB.setAttribute('aria-pressed','false')}
   sel=t;selB=b;b.classList.add('sel');b.setAttribute('aria-pressed','true');er.textContent='';
  };
  o.appendChild(b);
 });
 document.getElementById('mn').onclick=menu;
 cf.onclick=function(){
  if(!done){
   if(sel===null){er.textContent='Wähle zuerst eine Antwort aus.';return}
   done=true;
   var good=sel===q[3];
   if(good)score++;else wrong[q[0]]=1;
   o.querySelectorAll('.card').forEach(function(x){
    x.disabled=true;x.classList.remove('sel');
    var t=x.getAttribute('data-t');
    if(t===q[3]){x.classList.add('ok');x.insertAdjacentHTML('beforeend',CHECK+'<span class="sr">richtig</span>')}
    else if(t===sel){x.classList.add('bad');x.insertAdjacentHTML('beforeend',CROSS+'<span class="sr">falsch</span>')}
   });
   var ex=document.getElementById('ex');
   ex.innerHTML='<div class="ex '+(good?'good':'nope')+'"><b>'+(good?'Richtig.':'Nicht ganz. Richtig ist: '+q[3])+'</b>'+q[5]+'</div>';
   cf.textContent=(i===Q.length-1)?'Ergebnis ansehen':'Weiter';
   ex.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'});
  }else{
   i++;if(i<Q.length)show();else end();
  }
 };
}
function end(){
 pg.style.width='100%';
 var p=Math.round(score/Q.length*100),w=Object.keys(wrong),msg=p>=90?'Sehr stark.':p>=70?'Gut, ein paar Themen noch wiederholen.':'Guter Start, jetzt gezielt üben.';
 render('<div class="res"><span>Ergebnis</span><span class="big">'+score+' von '+Q.length+'</span><span>'+msg+'</span></div>'+(w.length?'<p>Nochmal anschauen: '+w.join(', ')+'</p>':'<p>Keine Fehler. Alle Themen sitzen.</p>')+'<button class="pill" id="mn">Zurück zum Menü</button>');
 foot.innerHTML='<div class="in"><p id="er"></p><button class="main" id="rs">Nochmal ('+MODES[mode][0]+')</button></div>';
 document.getElementById('rs').onclick=function(){start(mode)};
 document.getElementById('mn').onclick=menu;
}
menu();
</script>
