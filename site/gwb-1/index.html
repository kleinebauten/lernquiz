function menu(){
 var h='<h1>GWB Quiz, 1. Klasse</h1><p class="mut">Test am 17.11.2026: Erde, Kontinente, Karten lesen, Maßstab, Himmelsrichtungen, Höhe, Atlas, Österreich. Die Fragen kommen in zufälliger Reihenfolge.</p>';
 Object.keys(MODES).forEach(function(k){h+='<button data-m="'+k+'"><b style="font-weight:500">'+MODES[k][0]+'</b><br><span class="mut">'+MODES[k][1].length+' Fragen</span></button>'});
 app.innerHTML=h;
 app.querySelectorAll('button').forEach(function(b){b.onclick=function(){start(b.getAttribute('data-m'))}});
}
function start(m){mode=m;Q=MODES[m][1];order=shuf(Q.map(function(_,k){return k}));i=0;score=0;wrong={};show()}
function show(){
 var q=Q[order[i]],opts=shuf([q[3]].concat(q[4]));
 app.innerHTML='<div class="row"><span>'+q[0]+'</span><span>Frage '+(i+1)+' von '+Q.length+'</span></div><div class="bar"><i style="width:'+(i/Q.length*100)+'%"></i></div><p class="q">'+q[2]+'</p>'+q[1]+'<div id="o"></div><div id="fb"></div><button class="link" id="mn">Zurück zum Menü</button>';
 var o=document.getElementById('o');
 var sel=null,selB=null;
 opts.forEach(function(t){var b=document.createElement('button');b.className='opt';b.textContent=t;b.setAttribute('aria-pressed','false');b.onclick=function(){
  if(selB){selB.classList.remove('sel');selB.setAttribute('aria-pressed','false')}
  sel=t;selB=b;b.classList.add('sel');b.setAttribute('aria-pressed','true');
  document.getElementById('er').textContent='';
 };o.appendChild(b)});
 var er=document.createElement('p');er.id='er';er.style.cssText='color:var(--badf);font-size:13px;margin:0 0 8px;min-height:0';
 var cb=document.createElement('button');cb.id='cf';cb.className='center';cb.textContent='Antwort bestätigen';cb.style.cssText='border-color:var(--acc);color:var(--acc)';
 cb.onclick=function(){
  if(sel===null){er.textContent='Wähle zuerst eine Antwort aus.';return}
  document.getElementById('cf').remove();er.remove();
  pick(selB,sel,q);
 };
 o.appendChild(er);o.appendChild(cb);
 var hint=document.createElement('p');hint.className='mut';hint.style.cssText='font-size:13px;margin:0 0 8px';hint.textContent='Tippe eine Antwort an. Du kannst sie noch ändern, bis du bestätigst.';o.appendChild(hint);
 document.getElementById('mn').onclick=menu;
}
function pick(b,t,q){
 document.querySelectorAll('.opt').forEach(function(x){x.disabled=true;x.classList.remove('sel');if(x.textContent===q[3])x.classList.add('ok')});
 document.querySelectorAll('#o p.mut').forEach(function(x){x.remove()});
 var good=t===q[3];
 if(good)score++;else{b.classList.add('bad');wrong[q[0]]=1}
 var last=i===Q.length-1;
 document.getElementById('fb').innerHTML='<p class="mut" style="line-height:1.5;margin:6px 0 12px"><b style="font-weight:500;color:var(--fg)">'+(good?'Richtig. ':'Nicht ganz. ')+'</b>'+q[5]+'</p><button id="nx" class="center">'+(last?'Ergebnis ansehen':'Weiter')+'</button>';
 document.getElementById('nx').onclick=function(){i++;if(i<Q.length)show();else end()};
}
function end(){
 var p=Math.round(score/Q.length*100),w=Object.keys(wrong),msg=p>=90?'Sehr stark.':p>=70?'Gut, ein paar Themen noch wiederholen.':'Guter Start, jetzt gezielt üben.';
 app.innerHTML='<div class="res"><span class="mut">Ergebnis</span><b>'+score+' von '+Q.length+'</b><span class="mut">'+msg+'</span></div>'+(w.length?'<p>Nochmal anschauen: <b style="font-weight:500">'+w.join(', ')+'</b></p>':'<p>Keine Fehler. Alle Themen sitzen.</p>')+'<button id="rs" class="center">Nochmal ('+MODES[mode][0]+')</button><button id="mn" class="center">Zurück zum Menü</button>';
 document.getElementById('rs').onclick=function(){start(mode)};
 document.getElementById('mn').onclick=menu;
}
menu();
</script>
</body>
</html>
