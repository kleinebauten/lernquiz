function pip(r,x,y){var c=false;for(var a=0,b=r.length-1;a<r.length;b=a++){var xi=r[a][0],yi=r[a][1],xj=r[b][0],yj=r[b][1];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c}return c}

function resolve(c,x,y){var best=null,bd=1e9,d;
 if(c==='stadt'){MAPD.cities.forEach(function(o){d=Math.hypot(o.x-x,o.y-y);if(d<bd){bd=d;best=o.n}});return bd<=28?best:null}
 if(c==='land'){var w=dict('land','Wien');if(Math.hypot(w.lab[0]-x,w.lab[1]-y)<=12||inObj(w,x,y))return 'Wien';MAPD.states.forEach(function(o){if(o.n!=='Wien'&&inObj(o,x,y))best=o.n});return best}
 if(c==='nachbar'){var l=dict('nachbar','Liechtenstein');if(Math.hypot(l.lab[0]-x,l.lab[1]-y)<=14)return 'Liechtenstein';MAPD.neigh.forEach(function(o){if(inObj(o,x,y))best=o.n});return best}
 if(c==='fluss'){MAPD.rivers.forEach(function(o){d=dline(o,x,y);if(d<bd){bd=d;best=o.n}});return bd<=14?best:null}
 if(c==='see'){MAPD.lakes.forEach(function(o){d=dring(o,x,y);if(d<bd){bd=d;best=o.n}});return bd<=16?best:null}
 MAPD.ranges.forEach(function(o){d=dell(o,x,y);if(d<bd){bd=d;best=o.n}});return bd<=1?best:null}

function densify(strokes){var out=[];strokes.forEach(function(st){for(var k=0;k<st.length;k++){out.push(st[k]);if(k){var a=st[k-1],b=st[k],n=Math.ceil(Math.hypot(b.x-a.x,b.y-a.y)/3);for(var j=1;j<n;j++)out.push({x:a.x+(b.x-a.x)*j/n,y:a.y+(b.y-a.y)*j/n})}}});return out}
function dUser(pts,x,y){var m=1e9;for(var k=0;k<pts.length;k++){var d=Math.hypot(pts[k].x-x,pts[k].y-y);if(d<m)m=d}return m}
function inAT(x,y){for(var k=0;k<MAPD.states.length;k++)if(dring(MAPD.states[k],x,y)<=8)return true;return false}
function truthRiver(o){var out=[];o.lines.forEach(function(l){for(var k=1;k<l.length;k++){var a=l[k-1],b=l[k],n=Math.max(1,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/4));for(var j=0;j<n;j++){var x=a[0]+(b[0]-a[0])*j/n,y=a[1]+(b[1]-a[1])*j/n;if(inAT(x,y))out.push([x,y])}}});return out}
